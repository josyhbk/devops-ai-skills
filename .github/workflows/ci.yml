name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: aws-cost-audit selftest
        run: python3 aws-cost-audit/collect.py --selftest
      - name: drawio lint selftest
        run: python3 drawio-aws-diagram/lint.py --selftest
      - name: lint the starter and the example diagrams
        run: python3 drawio-aws-diagram/lint.py drawio-aws-diagram/starter.drawio drawio-aws-diagram/examples/*.png
